name: backend-ci

on:
  push:
    branches:
      - develop
      - main
      - CI/CD
  pull_request:
    branches:
      - develop
      - main
      - CI/CD

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20.18.1'
      - name: Install dependencies
        run: npm install

      # - name: Run tests
      #  run: npm test -- --watch=false

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/todo-app-backend:${{ github.sha }} .
      - name: Tag image as latest
        run: docker tag ${{ secrets.DOCKER_USERNAME }}/todo-app-backend:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/todo-app-backend:latest
      - name: Push Docker image (tag SHA)
        run: docker push ${{ secrets.DOCKER_USERNAME }}/todo-app-backend:${{ github.sha }}
      - name: Push Docker image (tag latest)
        run: docker push ${{ secrets.DOCKER_USERNAME }}/todo-app-backend:latest
      - name: SSH Deploy on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/todo-app-backend:${{ github.sha }}
            docker stop todo-app-backend || true
            docker rm todo-app-backend || true
            docker run -d --name todo-app-backend -p 3000:3000 ${{ secrets.DOCKER_USERNAME }}/todo-app-backend:${{ github.sha }}