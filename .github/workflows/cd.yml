name: Backend CD Pipeline

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging
    types:
      - closed

jobs:
  deploy:
    if: ${{ (github.event_name == 'push') || (github.event.pull_request.merged == true) }}
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Wait for CI to complete
        uses: lewagon/wait-on-check-action@v1.3.1
        with:
          ref: ${{ github.ref }}
          check-name: 'build'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

      - name: SSH Deploy on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/todo-app-backend:${{ github.sha }}
            docker stop todo-app-backend || true
            docker rm todo-app-backend || true
            docker run -d --name todo-app-backend -p 3000:3000 ${{ secrets.DOCKER_USERNAME }}/todo-app-backend:${{ github.sha }}
