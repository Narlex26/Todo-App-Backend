name: Backend CD Pipeline

on:
  workflow_run:
    workflows: ["Backend CI Pipeline"]
    types:
      - completed
    branches:
      - main
      - staging

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: SSH Deploy on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/todo-app-backend:${{ github.event.workflow_run.head_sha }}
            docker stop todo-app-backend || true
            docker rm todo-app-backend || true
            docker run -d --name todo-app-backend -p 3000:3000 ${{ secrets.DOCKER_USERNAME }}/todo-app-backend:${{ github.event.workflow_run.head_sha }}
