version: "3.8"
services:
  backend:
    build: .
    container_name: express_api
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - db
    environment:
      DB_HOST: db             # 👈 IMPORTANT
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: todo_app_db
    networks:
    - app_network
  db:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: todo_app_db 
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_network


volumes:
  db_data:

networks:
  app_network:
    driver: bridge
    external: true
 